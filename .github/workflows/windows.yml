name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Browser UI tests
        shell: pwsh
        run: |
          # The normal-animation suite must not inherit this ephemeral runner's
          # Reduce Motion setting. The separate reduced-motion suite forces it
          # in Chrome, and the runner setting is restored even if tests fail.
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class TestAnimationPreference {
            [DllImport("user32.dll", EntryPoint="SystemParametersInfoW")]
            public static extern bool Read(uint action, uint param, out bool value, uint flags);
            [DllImport("user32.dll", EntryPoint="SystemParametersInfoW")]
            public static extern bool Write(uint action, uint param, IntPtr value, uint flags);
          }
          '@
          $before = $false
          if (-not [TestAnimationPreference]::Read(0x1042, 0, [ref]$before, 0)) { throw 'Cannot read test animation preference' }
          try {
            if (-not [TestAnimationPreference]::Write(0x1043, 0, [IntPtr]1, 0)) { throw 'Cannot set test animation preference' }
            python scripts/ui-test.py
            $testExit = $LASTEXITCODE
          } finally {
            $restore = if ($before) { [IntPtr]1 } else { [IntPtr]0 }
            [TestAnimationPreference]::Write(0x1043, 0, $restore, 0) | Out-Null
          }
          if ($testExit -ne 0) { exit $testExit }
      - name: Build the Windows installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis
      - name: Check native startup and package portable download
        shell: pwsh
        run: |
          $binary = 'src-tauri/target/release/agent-monitor.exe'
          $env:AGENT_MONITOR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'agent-monitor-smoke'
          New-Item -ItemType Directory -Force $env:AGENT_MONITOR_DATA_DIR | Out-Null
          $env:AGENT_MONITOR_EMPTY = '1'
          & $binary --dump-tasks | Out-File -Encoding utf8 dump-tasks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native snapshot smoke test failed' }
          if ((Get-Content -Raw dump-tasks.txt) -notmatch '"tasks"') { throw 'Snapshot output missing' }
          $env:AGENT_MONITOR_SIMULATED = '1'
          $app = Start-Process -FilePath $binary -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw 'Desktop app exited during startup smoke test' }
          Stop-Process -Id $app.Id
          $out = 'dist/windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $binary "$out/agent-monitor.exe"
          Copy-Item docs/WINDOWS.md "$out/README.md"
          Compress-Archive -Path "$out/agent-monitor.exe", "$out/README.md" -DestinationPath "$out/Agent-Monitor-windows-x64.zip"
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          Copy-Item $installer.FullName "$out/Agent-Monitor-windows-x64-setup.exe"
          Get-ChildItem "$out/Agent-Monitor-*" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii "$out/SHA256SUMS-windows.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Monitor-windows-x64
          path: |
            dist/windows/Agent-Monitor-*
            dist/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
