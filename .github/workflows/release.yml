name: Release
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: agent-monitor.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: agent-monitor
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-monitor
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agent-monitor

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - name: Build
        run: npx tauri build --target ${{ matrix.target }}
      - name: Rename artifact
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/agent-monitor.exe agent-monitor.exe
          else
            cp src-tauri/target/${{ matrix.target }}/release/agent-monitor agent-monitor-${{ matrix.target }}
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-monitor*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
