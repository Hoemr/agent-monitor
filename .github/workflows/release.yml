name: Build and release (macOS)

# Tag pushes always produce signed updater artifacts: an unsigned release would
# silently break in-app updates for every existing install, so a missing
# TAURI_SIGNING_PRIVATE_KEY fails the job loudly. Manual workflow_dispatch runs
# can still be used as dry runs (skip_updater=true) without the secret.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_updater:
        description: 'Dry run: skip signed updater artifacts (no latest.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide whether to build updater artifacts
        id: updater
        run: |
          sign=false
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            sign=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.skip_updater }}" != "true" ]; then
            sign=true
          fi
          echo "sign=${sign}" >> "$GITHUB_OUTPUT"
          echo "updater artifacts: ${sign}"

      - name: Test
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Import persistent macOS release signing identity
        shell: python
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          import base64, os, pathlib, secrets, subprocess, sys, tempfile
          if not os.environ.get('CERTIFICATE') or not os.environ.get('SIGNING_IDENTITY'):
              sys.exit('Configure MACOS_SIGNING_CERTIFICATE_P12 and MACOS_SIGNING_IDENTITY; ad-hoc releases are no longer allowed.')
          def run(*args):
              result = subprocess.run(args, capture_output=True, text=True)
              if result.returncode:
                  sys.exit(result.stderr or 'Code signing setup failed')
          folder = pathlib.Path(tempfile.mkdtemp())
          p12 = folder / 'identity.p12'
          p12.write_bytes(base64.b64decode(os.environ['CERTIFICATE'], validate=True))
          keychain = str(folder / 'release.keychain-db')
          password = secrets.token_urlsafe(32)
          run('security', 'create-keychain', '-p', password, keychain)
          run('security', 'unlock-keychain', '-p', password, keychain)
          run('security', 'import', str(p12), '-k', keychain, '-P', os.environ['CERTIFICATE_PASSWORD'], '-T', '/usr/bin/codesign')
          run('security', 'set-key-partition-list', '-S', 'apple-tool:,apple:', '-s', '-k', password, keychain)
          run('security', 'default-keychain', '-d', 'user', '-s', keychain)
          p12.unlink()

      - name: Assemble .app bundle
        env:
          AGENT_MONITOR_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash scripts/bundle-mac.sh

      - name: Package (manual download zip)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Agent Monitor.app" "Agent-Monitor-macos-arm64.zip"

      - name: Require the updater signing secret
        if: steps.updater.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Signed updater artifacts are mandatory for releases (in-app updates verify this signature); add the secret before tagging."
            exit 1
          fi

      - name: Build signed updater artifacts (tarball + .sig + latest.json)
        if: steps.updater.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && git rev-parse -q --verify "refs/tags/${GITHUB_REF_NAME}" >/dev/null; then
            NOTES="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
            if [ -n "${NOTES//[[:space:]]/}" ]; then export RELEASE_NOTES="${NOTES}"; fi
          fi
          bash scripts/make-updater-artifact.sh --tag "${GITHUB_REF_NAME}"

      - name: Upload manual-download artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Monitor-macos-arm64
          path: dist/Agent-Monitor-macos-arm64.zip

      - name: Upload updater artifacts
        if: steps.updater.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Monitor-macos-arm64-updater
          path: |
            dist/Agent-Monitor-macos-arm64.app.tar.gz
            dist/Agent-Monitor-macos-arm64.app.tar.gz.sig
            dist/latest.json

      - name: Attach manual download to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Agent-Monitor-macos-arm64.zip

      # latest.json must be attached to the same release as the tarball: the
      # app reads https://github.com/<repo>/releases/latest/download/latest.json,
      # which only resolves published, non-prerelease releases.
      - name: Attach updater artifacts to release
        if: startsWith(github.ref, 'refs/tags/') && steps.updater.outputs.sign == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Agent-Monitor-macos-arm64.app.tar.gz
            dist/Agent-Monitor-macos-arm64.app.tar.gz.sig
            dist/latest.json
