[package]
name = "agent-monitor"
version = "0.7.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
base64 = "0.22"
dirs = "6"
rusqlite = "0.40.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
