[package]
name = "agent-monitor"
version = "0.8.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
base64 = "0.22"
dirs = "6"
rusqlite = "0.40.2"
zstd = { version = "0.13", default-features = false }
roxmltree = "0.20"
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
# Already in the tree via tauri/wry; declared directly for the island's
# notch-geometry probe and menu-bar-level window promotion (island.rs).
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSWindow", "NSStatusBar"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-notification = "=2.3.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
