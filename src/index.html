<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="mode-collapsed no-tasks">
    <!-- Collapsed pet -->
    <div id="pet" role="button" tabindex="0"
         aria-label="Agent Monitor, no active sessions, click to expand">
      <span class="pet-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="badge" class="badge" hidden aria-hidden="true">0</span>
      <span class="pet-grip" aria-hidden="true"></span>
    </div>

    <!-- Expanded popover -->
    <section id="panel" hidden aria-label="Sessions">
      <header id="dragbar">
        <h1 class="panel-title" id="panel-title">Sessions</h1>
        <span id="header-meta" class="header-meta" hidden></span>
        <button id="collapse-btn" class="icon-btn" aria-label="Collapse" title="Collapse">
          <span class="chevron" aria-hidden="true"></span>
        </button>
      </header>
      <main id="list" role="list" tabindex="-1"></main>
      <footer id="footer">
        <span id="footer-count"></span>
        <span id="footer-hint" class="dim"></span>
        <button id="lang-btn" class="link-btn" aria-label="Switch language">中</button>
      </footer>
    </section>

    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button id="toast-action" class="link-btn" hidden></button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
