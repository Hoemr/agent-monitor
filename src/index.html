<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="mode-collapsed no-tasks" data-lang="en">
    <!-- Collapsed pet indicator -->
    <div id="pet" role="button" tabindex="0"
         aria-label="Agent Monitor, no active sessions, click to expand">
      <div class="pet-core" aria-hidden="true">
        <span class="pet-glyph">▚</span>
      </div>
      <span id="badge" class="badge" hidden aria-hidden="true">0</span>
      <span class="pet-grip" aria-hidden="true"></span>
    </div>

    <!-- Expanded panel -->
    <section id="panel" hidden aria-label="Task list">
      <header id="dragbar">
        <span id="drag-handle" class="drag-handle" title="Drag to move" aria-label="Drag to move">⠿</span>
        <span class="panel-title" id="panel-title">AGENT MONITOR</span>
        <span id="attention" class="attention-pill" hidden></span>
        <button id="collapse-btn" class="icon-btn" aria-label="Collapse">▁</button>
      </header>
      <main id="list" role="list" tabindex="-1"></main>
      <footer id="footer">
        <span id="footer-count">0</span>
        <span id="footer-hint" class="dim"></span>
        <button id="lang-btn" class="link-btn" aria-label="Switch language">中</button>
      </footer>
    </section>

    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button id="toast-action" class="link-btn" hidden></button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
