<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="mode-collapsed no-tasks">
    <!-- Collapsed pet -->
    <div id="pet" role="button" tabindex="0"
         aria-label="Agent Monitor, no active sessions, click to expand">
      <img id="pet-icon" class="pet-icon" hidden alt="">
      <span class="pet-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="badge" class="badge" hidden aria-hidden="true">0</span>
      <span id="new-badge" class="new-badge" hidden aria-hidden="true">0</span>
      <span id="notice-dot" class="notice-dot" hidden aria-hidden="true"></span>
      <span class="pet-grip" aria-hidden="true"></span>
    </div>

    <!-- Expanded popover -->
    <section id="panel" hidden aria-label="Sessions">
      <header id="dragbar">
        <h1 class="panel-title" id="panel-title">Sessions</h1>
        <span id="header-meta" class="header-meta" hidden></span>
        <span id="header-question" class="header-question" hidden></span>
        <span id="header-new" class="header-new" hidden></span>
        <button id="collapse-btn" class="icon-btn" aria-label="Collapse" title="Collapse">
          <span class="chevron" aria-hidden="true"></span>
        </button>
      </header>
      <main id="list" role="list" tabindex="-1"></main>
      <footer id="footer">
        <span id="footer-count"></span>
        <span id="footer-hint" class="dim"></span>
        <button id="settings-btn" class="icon-btn gear-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </footer>
    </section>

    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button id="toast-action" class="link-btn" hidden></button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
